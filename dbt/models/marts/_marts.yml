version: 2
models:
- name: fct_sessions
  description: 'One row per GA4 session with channel, purchases and (where known) the customer. The base table for attribution:
    sessions are the touchpoints.'
  columns:
  - name: session_key
    description: Device and GA4 session id joined with a dot. Primary key.
    data_tests:
    - unique
    - not_null
  - name: user_pseudo_id
    description: GA4 device that had the session.
    data_tests:
    - not_null
  - name: ga_session_id
    description: GA4 session id. Unique only together with user_pseudo_id.
    data_tests:
    - not_null
  - name: ga_session_number
    description: 1 for the device's first session, 2 for its second, and so on.
  - name: is_first_session
    description: The device's first session.
  - name: session_date
    description: Day the session started.
    data_tests:
    - not_null
  - name: session_start_ts
    description: Time of the first event (UTC).
    data_tests:
    - not_null
  - name: session_end_ts
    description: Time of the last event (UTC).
    data_tests:
    - not_null
  - name: duration_seconds
    description: Seconds between the first and last event.
    data_tests:
    - not_null
  - name: events
    description: Number of events in the session.
    data_tests:
    - not_null
  - name: page_views
    description: Number of page_view events.
  - name: is_engaged
    description: GA4 marked the session as engaged.
  - name: engagement_time_msec
    description: Total engaged time in milliseconds.
  - name: landing_page
    description: First page URL of the session.
  - name: referrer
    description: First referrer URL seen in the session.
  - name: source
    description: 'SESSION-level source: first source parameter seen. Empty on about 1 session in 4.'
  - name: medium
    description: 'SESSION-level medium: first medium parameter seen.'
  - name: campaign
    description: 'SESSION-level campaign: first campaign parameter seen. Often obfuscated as <Other>.'
  - name: channel_group
    description: Marketing channel from the session source and medium (macro channel_group). Unassigned when GA4 gave neither.
      Self Referral when the source is the store's own domain (not a marketing touch).
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - Paid Search
          - Display
          - Paid Social
          - Affiliate
          - Email
          - Organic Search
          - Organic Social
          - Referral
          - Self Referral
          - Direct
          - Other
          - Unassigned
  - name: is_paid
    description: 'The channel is one with ad spend: Paid Search, Display, Paid Social, Affiliate or Email.'
    data_tests:
    - not_null
  - name: ad_campaign_key
    description: Key that joins a paid session to stg_ad_spend.campaign_key. Empty for unpaid sessions.
  - name: has_gclid
    description: A Google Ads click id was present in the session.
  - name: first_touch_source
    description: 'USER-level source: how the device was first acquired. Kept to compare with the session source.'
  - name: first_touch_medium
    description: USER-level medium of first acquisition.
  - name: first_touch_campaign
    description: USER-level campaign of first acquisition.
  - name: country
    description: Country of the device.
  - name: device_category
    description: desktop, mobile or tablet.
  - name: viewed_item
    description: The session had a view_item event.
  - name: added_to_cart
    description: The session had an add_to_cart event.
  - name: began_checkout
    description: The session had a begin_checkout event.
  - name: purchase_events
    description: Raw purchase events, including invalid ones (no transaction id, zero revenue, repeats).
  - name: valid_purchases
    description: Valid purchase transactions in the session (stg_ga4__purchases).
    data_tests:
    - not_null
  - name: revenue_usd
    description: Revenue of those purchases in USD.
    data_tests:
    - not_null
  - name: is_converted
    description: The session contains at least one valid purchase.
    data_tests:
    - not_null
  - name: customer_id
    description: Customer the device is linked to by identity resolution. Empty for the large majority of sessions.
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_crm__customers')
          field: customer_id
  - name: is_identified
    description: The session belongs to a known customer.
    data_tests:
    - not_null
  - name: identity_link_rule
    description: Strongest identity rule behind the link.
  - name: identity_confidence
    description: high or medium.
- name: fct_orders
  description: One row per CRM order, with the customer's order history and, for web orders, the GA4 session and channel that
    produced it.
  columns:
  - name: order_id
    description: Primary key.
    data_tests:
    - unique
    - not_null
  - name: customer_id
    description: Customer who placed the order.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_crm__customers')
          field: customer_id
  - name: order_ts
    description: Order time (UTC).
    data_tests:
    - not_null
  - name: order_date
    description: Order day.
    data_tests:
    - not_null
  - name: order_channel
    description: web (a real GA4 purchase) or app (invented).
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - web
          - app
  - name: status
    description: completed or refunded.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - completed
          - refunded
  - name: is_refunded
    description: True when the order was refunded.
    data_tests:
    - not_null
  - name: order_value_usd
    description: Order value in USD.
    data_tests:
    - not_null
  - name: refund_usd
    description: Refunded amount (the full value when refunded).
    data_tests:
    - not_null
  - name: net_revenue_usd
    description: Order value minus refund. Use this for revenue and lifetime value.
    data_tests:
    - not_null
  - name: item_count
    description: Units in the order.
  - name: order_number
    description: The customer's 1st, 2nd, 3rd... order, in time order.
    data_tests:
    - not_null
  - name: is_first_order
    description: The customer's first order in the data.
    data_tests:
    - not_null
  - name: previous_order_ts
    description: Time of the customer's previous order. Empty for a first order.
  - name: days_since_previous_order
    description: Days since the customer's previous order. Empty for a first order.
  - name: days_since_first_order
    description: Days since the customer's first order. 0 for a first order.
    data_tests:
    - not_null
  - name: customer_country
    description: Customer country.
  - name: customer_created_at
    description: Customer account creation time.
  - name: ga_transaction_id
    description: GA4 transaction id. Empty on app orders and on about 8% of web orders.
  - name: ga4_match_status
    description: 'How far the link to GA4 goes: matched, web_no_transaction_id or app_order. A web order whose transaction id is not in GA4 (web_unmatched) is not an allowed value: the test fails the build.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - matched
          - web_no_transaction_id
          - app_order
  - name: ga_user_pseudo_id
    description: GA4 device that placed the order. Matched orders only.
  - name: ga_session_key
    description: GA4 session that produced the order. Matched orders only.
  - name: ga_revenue_usd
    description: Revenue GA4 recorded for the purchase. Equals order_value_usd on matched orders.
  - name: purchase_session_number
    description: Which session of the device made the purchase (1 = the first visit).
  - name: purchase_session_date
    description: Day of the purchasing session.
  - name: purchase_channel_group
    description: Channel of the purchasing session. Last-touch view only; attribution models look at earlier sessions too.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Paid Search
          - Display
          - Paid Social
          - Affiliate
          - Email
          - Organic Search
          - Organic Social
          - Referral
          - Self Referral
          - Direct
          - Other
          - Unassigned
  - name: purchase_source
    description: Source of the purchasing session.
  - name: purchase_medium
    description: Medium of the purchasing session.
  - name: purchase_campaign
    description: Campaign of the purchasing session.
- name: dim_customers
  description: 'One row per CRM customer, including sign-ups who never ordered: profile, order summary, linked GA4 devices and
    the sessions on them. Base table for RFM, lifetime value and segments. Website fields cover only the customers whose devices
    identity resolution could link.'
  columns:
  - name: customer_id
    description: CRM customer id. Primary key.
    data_tests:
    - unique
    - not_null
    - relationships:
        arguments:
          to: ref('stg_crm__customers')
          field: customer_id
  - name: full_name
    description: First and last name.
  - name: email
    description: Lower-cased email address.
    data_tests:
    - not_null
  - name: email_sha256
    description: SHA-256 of the email, the key used for hashed-email identity matching.
  - name: country
    description: Customer country.
  - name: created_at
    description: Account creation time.
    data_tests:
    - not_null
  - name: created_date
    description: Account creation day.
  - name: created_month
    description: First day of the month the account was created (sign-up cohort).
  - name: marketing_opt_in
    description: Whether the customer agreed to marketing messages.
  - name: orders
    description: Number of CRM orders (refunded orders included).
    data_tests:
    - not_null
  - name: is_buyer
    description: Placed at least one order.
    data_tests:
    - not_null
  - name: is_repeat_buyer
    description: Placed two or more orders.
  - name: refunded_orders
    description: Orders that were refunded.
  - name: web_orders
    description: Orders placed on the website.
  - name: app_orders
    description: Orders placed in the app.
  - name: items
    description: Items across all orders.
  - name: gross_revenue_usd
    description: Sum of order values. 0 for customers without orders.
  - name: refund_usd
    description: Sum of refunds.
  - name: net_revenue_usd
    description: Gross revenue minus refunds. Use this for lifetime value.
  - name: avg_order_value_usd
    description: Gross revenue divided by orders. Empty for customers without orders.
  - name: first_order_ts
    description: Time of the first order.
  - name: last_order_ts
    description: Time of the latest order.
  - name: first_order_date
    description: Day of the first order.
  - name: last_order_date
    description: Day of the latest order.
  - name: first_order_channel
    description: web or app, for the first order.
  - name: first_order_ga4_match_status
    description: How far the first order links to GA4 (matched, web_no_transaction_id, app_order).
  - name: first_order_channel_group
    description: Marketing channel of the session that produced the first order. Empty unless the order is matched to GA4.
  - name: linked_devices
    description: GA4 devices linked to the customer by identity resolution.
    data_tests:
    - not_null
  - name: has_linked_device
    description: At least one linked device.
  - name: has_high_confidence_link
    description: At least one link made by identify_verified or order_match.
  - name: sessions
    description: GA4 sessions on the linked devices. 0 when no device is linked.
  - name: converted_sessions
    description: Those sessions that contained a valid purchase.
  - name: first_session_date
    description: Day of the first session on a linked device.
  - name: last_session_date
    description: Day of the latest session on a linked device.
  - name: first_session_channel_group
    description: Channel of that first session. First touch as GA4 sees it, not necessarily how the customer was acquired.
  - name: first_session_source
    description: Source of the first session.
  - name: first_session_medium
    description: Medium of the first session.
