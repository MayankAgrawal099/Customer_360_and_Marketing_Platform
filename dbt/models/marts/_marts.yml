version: 2
models:
- name: fct_sessions
  description: 'One row per GA4 session with channel, purchases and (where known) the customer. The base table for attribution:
    sessions are the touchpoints.'
  columns:
  - name: session_key
    description: Device and GA4 session id joined with a dot. Primary key.
    data_tests:
    - unique
    - not_null
  - name: user_pseudo_id
    description: GA4 device that had the session.
    data_tests:
    - not_null
  - name: ga_session_id
    description: GA4 session id. Unique only together with user_pseudo_id.
    data_tests:
    - not_null
  - name: ga_session_number
    description: 1 for the device's first session, 2 for its second, and so on.
  - name: is_first_session
    description: The device's first session.
  - name: session_date
    description: Day the session started.
    data_tests:
    - not_null
  - name: session_start_ts
    description: Time of the first event (UTC).
    data_tests:
    - not_null
  - name: session_end_ts
    description: Time of the last event (UTC).
    data_tests:
    - not_null
  - name: duration_seconds
    description: Seconds between the first and last event.
    data_tests:
    - not_null
  - name: events
    description: Number of events in the session.
    data_tests:
    - not_null
  - name: page_views
    description: Number of page_view events.
  - name: is_engaged
    description: GA4 marked the session as engaged.
  - name: engagement_time_msec
    description: Total engaged time in milliseconds.
  - name: landing_page
    description: First page URL of the session.
  - name: referrer
    description: First referrer URL seen in the session.
  - name: source
    description: 'SESSION-level source: first source parameter seen. Empty on about 1 session in 4.'
  - name: medium
    description: 'SESSION-level medium: first medium parameter seen.'
  - name: campaign
    description: 'SESSION-level campaign: first campaign parameter seen. Often obfuscated as <Other>.'
  - name: channel_group
    description: Marketing channel from the session source and medium (macro channel_group). Unassigned when GA4 gave neither.
      Self Referral when the source is the store's own domain (not a marketing touch).
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - Paid Search
          - Display
          - Paid Social
          - Affiliate
          - Email
          - Organic Search
          - Organic Social
          - Referral
          - Self Referral
          - Direct
          - Other
          - Unassigned
  - name: is_paid
    description: 'The channel is one with ad spend: Paid Search, Display, Paid Social, Affiliate or Email.'
    data_tests:
    - not_null
  - name: ad_campaign_key
    description: Key that joins a paid session to stg_ad_spend.campaign_key. Empty for unpaid sessions.
  - name: has_gclid
    description: A Google Ads click id was present in the session.
  - name: first_touch_source
    description: 'USER-level source: how the device was first acquired. Kept to compare with the session source.'
  - name: first_touch_medium
    description: USER-level medium of first acquisition.
  - name: first_touch_campaign
    description: USER-level campaign of first acquisition.
  - name: country
    description: Country of the device.
  - name: device_category
    description: desktop, mobile or tablet.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - desktop
          - mobile
          - tablet
        config:
          severity: warn
  - name: viewed_item
    description: The session had a view_item event.
  - name: added_to_cart
    description: The session had an add_to_cart event.
  - name: began_checkout
    description: The session had a begin_checkout event.
  - name: purchase_events
    description: Raw purchase events, including invalid ones (no transaction id, zero revenue, repeats).
  - name: valid_purchases
    description: Valid purchase transactions in the session (stg_ga4__purchases).
    data_tests:
    - not_null
  - name: revenue_usd
    description: Revenue of those purchases in USD.
    data_tests:
    - not_null
  - name: is_converted
    description: The session contains at least one valid purchase.
    data_tests:
    - not_null
  - name: customer_id
    description: Customer the device is linked to by identity resolution. Empty for the large majority of sessions.
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_crm__customers')
          field: customer_id
  - name: is_identified
    description: The session belongs to a known customer.
    data_tests:
    - not_null
  - name: identity_link_rule
    description: Strongest identity rule behind the link.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - identify_verified
          - order_match
          - identify_unverified
          - email_hash
  - name: identity_confidence
    description: high or medium.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - high
          - medium
- name: fct_orders
  description: One row per CRM order, with the customer's order history and, for web orders, the GA4 session and channel that
    produced it.
  columns:
  - name: order_id
    description: Primary key.
    data_tests:
    - unique
    - not_null
  - name: customer_id
    description: Customer who placed the order.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_crm__customers')
          field: customer_id
  - name: order_ts
    description: Order time (UTC).
    data_tests:
    - not_null
  - name: order_date
    description: Order day.
    data_tests:
    - not_null
  - name: order_channel
    description: web (a real GA4 purchase) or app (invented).
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - web
          - app
  - name: status
    description: completed or refunded.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - completed
          - refunded
  - name: is_refunded
    description: True when the order was refunded.
    data_tests:
    - not_null
  - name: order_value_usd
    description: Order value in USD.
    data_tests:
    - not_null
  - name: refund_usd
    description: Refunded amount (the full value when refunded).
    data_tests:
    - not_null
  - name: net_revenue_usd
    description: Order value minus refund. Use this for revenue and lifetime value.
    data_tests:
    - not_null
  - name: item_count
    description: Units in the order.
  - name: order_number
    description: The customer's 1st, 2nd, 3rd... order, in time order.
    data_tests:
    - not_null
  - name: is_first_order
    description: The customer's first order in the data.
    data_tests:
    - not_null
  - name: previous_order_ts
    description: Time of the customer's previous order. Empty for a first order.
  - name: days_since_previous_order
    description: Days since the customer's previous order. Empty for a first order.
  - name: days_since_first_order
    description: Days since the customer's first order. 0 for a first order.
    data_tests:
    - not_null
  - name: customer_country
    description: Customer country.
  - name: customer_created_at
    description: Customer account creation time.
  - name: ga_transaction_id
    description: GA4 transaction id. Empty on app orders and on about 8% of web orders.
  - name: ga4_match_status
    description: 'How far the link to GA4 goes: matched, web_no_transaction_id or app_order. A web order whose transaction
      id is not in GA4 (web_unmatched) is not an allowed value: the test fails the build.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - matched
          - web_no_transaction_id
          - app_order
  - name: ga_user_pseudo_id
    description: GA4 device that placed the order. Matched orders only.
  - name: ga_session_key
    description: GA4 session that produced the order. Matched orders only.
  - name: ga_revenue_usd
    description: Revenue GA4 recorded for the purchase. Equals order_value_usd on matched orders.
  - name: purchase_session_number
    description: Which session of the device made the purchase (1 = the first visit).
  - name: purchase_session_date
    description: Day of the purchasing session.
  - name: purchase_channel_group
    description: Channel of the purchasing session. Last-touch view only; attribution models look at earlier sessions too.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Paid Search
          - Display
          - Paid Social
          - Affiliate
          - Email
          - Organic Search
          - Organic Social
          - Referral
          - Self Referral
          - Direct
          - Other
          - Unassigned
  - name: purchase_source
    description: Source of the purchasing session.
  - name: purchase_medium
    description: Medium of the purchasing session.
  - name: purchase_campaign
    description: Campaign of the purchasing session.
- name: dim_customers
  description: 'One row per CRM customer, including sign-ups who never ordered: profile, order summary, linked GA4 devices
    and the sessions on them. Base table for RFM, lifetime value and segments. Website fields cover only the customers whose
    devices identity resolution could link.'
  columns:
  - name: customer_id
    description: CRM customer id. Primary key.
    data_tests:
    - unique
    - not_null
    - relationships:
        arguments:
          to: ref('stg_crm__customers')
          field: customer_id
  - name: full_name
    description: First and last name.
  - name: email
    description: Lower-cased email address.
    data_tests:
    - not_null
  - name: email_sha256
    description: SHA-256 of the email, the key used for hashed-email identity matching.
  - name: country
    description: Customer country.
  - name: created_at
    description: Account creation time.
    data_tests:
    - not_null
  - name: created_date
    description: Account creation day.
    data_tests:
    - not_null
  - name: created_month
    description: First day of the month the account was created (sign-up cohort).
  - name: marketing_opt_in
    description: Whether the customer agreed to marketing messages.
    data_tests:
    - not_null
  - name: orders
    description: Number of CRM orders (refunded orders included).
    data_tests:
    - not_null
  - name: is_buyer
    description: Placed at least one order.
    data_tests:
    - not_null
  - name: is_repeat_buyer
    description: Placed two or more orders.
  - name: refunded_orders
    description: Orders that were refunded.
  - name: web_orders
    description: Orders placed on the website.
  - name: app_orders
    description: Orders placed in the app.
  - name: items
    description: Items across all orders.
  - name: gross_revenue_usd
    description: Sum of order values. 0 for customers without orders.
  - name: refund_usd
    description: Sum of refunds.
  - name: net_revenue_usd
    description: Gross revenue minus refunds. Use this for lifetime value.
    data_tests:
    - not_null
  - name: avg_order_value_usd
    description: Gross revenue divided by orders. Empty for customers without orders.
  - name: first_order_ts
    description: Time of the first order.
  - name: last_order_ts
    description: Time of the latest order.
  - name: first_order_date
    description: Day of the first order.
  - name: last_order_date
    description: Day of the latest order.
  - name: first_order_channel
    description: web or app, for the first order.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - web
          - app
  - name: first_order_ga4_match_status
    description: How far the first order links to GA4 (matched, web_no_transaction_id, app_order).
    data_tests:
    - accepted_values:
        arguments:
          values:
          - matched
          - web_no_transaction_id
          - app_order
  - name: first_order_channel_group
    description: Marketing channel of the session that produced the first order. Empty unless the order is matched to GA4.
    data_tests:
    - accepted_values:
        arguments:
          values: &id001
          - Paid Search
          - Display
          - Paid Social
          - Affiliate
          - Email
          - Organic Search
          - Organic Social
          - Referral
          - Self Referral
          - Direct
          - Other
          - Unassigned
  - name: linked_devices
    description: GA4 devices linked to the customer by identity resolution.
    data_tests:
    - not_null
  - name: has_linked_device
    description: At least one linked device.
    data_tests:
    - not_null
  - name: has_high_confidence_link
    description: At least one link made by identify_verified or order_match.
  - name: sessions
    description: GA4 sessions on the linked devices. 0 when no device is linked.
  - name: converted_sessions
    description: Those sessions that contained a valid purchase.
  - name: first_session_date
    description: Day of the first session on a linked device.
  - name: last_session_date
    description: Day of the latest session on a linked device.
  - name: first_session_channel_group
    description: Channel of that first session. First touch as GA4 sees it, not necessarily how the customer was acquired.
    data_tests:
    - accepted_values:
        arguments:
          values: *id001
  - name: first_session_source
    description: Source of the first session.
  - name: first_session_medium
    description: Medium of the first session.
- name: fct_customer_rfm
  description: 'One row per buyer (customer with at least one order): recency, frequency and monetary value, each scored 1
    (worst) to 5 (best). Customers without orders are not scored. Input to the segments and lifetime-value models.'
  columns:
  - name: customer_id
    description: CRM customer id. Primary key.
    data_tests:
    - unique
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customers')
          field: customer_id
  - name: as_of_date
    description: Day after the latest order in the data. Recency is measured to this day, so results never depend on today's
      date.
    data_tests:
    - not_null
  - name: first_order_date
    description: Day of the customer's first order.
  - name: last_order_date
    description: Day of the customer's latest order.
  - name: recency_days
    description: Days from the latest order to as_of_date. Smaller is better; always at least 1.
    data_tests:
    - not_null
  - name: frequency
    description: Number of orders (refunded orders included).
    data_tests:
    - not_null
  - name: monetary_usd
    description: 'Net revenue in USD: order value minus refunds.'
    data_tests:
    - not_null
  - name: r_score
    description: Recency score 1-5 (5 = most recent). Quintile of buyers; equal values share a score.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: &id002
          - 1
          - 2
          - 3
          - 4
          - 5
          quote: false
  - name: f_score
    description: 'Frequency score 1-5: 1, 2, 3, 4 orders score 1-4, 5 or more orders score 5.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: *id002
          quote: false
  - name: m_score
    description: Monetary score 1-5 (5 = highest net revenue). Quintile of buyers; equal values share a score.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: *id002
          quote: false
  - name: rfm_code
    description: The three scores as text, for example 534 = recency 5, frequency 3, monetary 4.
    data_tests:
    - not_null
  - name: rfm_total
    description: Sum of the three scores, 3 to 15.
    data_tests:
    - not_null
- name: fct_customer_clv
  description: 'One row per buyer: historical net revenue plus predicted 90-day and 12-month revenue from a simple shrinkage
    model (a customer''s own repeat rate and order value blended with the population''s). Customers without orders are not
    valued. Input to the segments.'
  columns:
  - name: customer_id
    description: CRM customer id. Primary key.
    data_tests:
    - unique
    - not_null
    - relationships:
        arguments:
          to: ref('fct_customer_rfm')
          field: customer_id
  - name: as_of_date
    description: Day after the latest order in the data; the same date as the RFM model.
    data_tests: &id003
    - not_null
  - name: first_order_date
    description: Day of the first order.
  - name: last_order_date
    description: Day of the latest order.
  - name: days_observed
    description: Days from the first order to as_of_date. At least 1.
    data_tests: *id003
  - name: orders
    description: Number of orders.
    data_tests: *id003
  - name: repeat_orders
    description: Orders after the first one (orders minus 1).
    data_tests: *id003
  - name: gross_revenue_usd
    description: Sum of order values.
  - name: historical_net_revenue_usd
    description: 'Net revenue to date (order value minus refunds): the value the customer has actually brought in.'
    data_tests: *id003
  - name: population_repeat_rate_per_day
    description: Repeat orders per day across all buyers; the starting point each customer's rate is pulled towards.
    data_tests: *id003
  - name: population_aov_usd
    description: Net revenue per order across all buyers; the starting point for each customer's order value.
    data_tests: *id003
  - name: expected_repeat_rate_per_day
    description: 'The customer''s expected repeat orders per day: their own rate blended with the population''s (prior of
      90 days).'
    data_tests: *id003
  - name: expected_aov_usd
    description: 'The customer''s expected net value per order: their own blended with the population''s (prior of 3 orders).'
    data_tests: *id003
  - name: predicted_orders_90d
    description: Expected repeat orders over the next 90 days.
    data_tests: *id003
  - name: predicted_revenue_90d_usd
    description: Expected net revenue over the next 90 days. Sits within the span the data has observed.
    data_tests: *id003
  - name: predicted_orders_12m
    description: 'Expected repeat orders over the next 365 days. About four times the history observed and with no churn:
      read as an upper estimate.'
    data_tests: *id003
  - name: predicted_revenue_12m_usd
    description: Expected net revenue over the next 365 days.
    data_tests: *id003
  - name: clv_12m_usd
    description: 'Customer lifetime value over 12 months: historical net revenue plus predicted 12-month revenue.'
    data_tests: *id003
- name: dim_customer_segments
  description: 'The segment definitions, one row per segment: rule in plain words, the rule as applied, and the recommended
    action. Same text as docs/customer_segments.md.'
  columns:
  - name: segment_order
    description: Order the rules are checked in; the first match wins.
    data_tests:
    - unique
    - not_null
  - name: segment
    description: Segment name. Primary key.
    data_tests:
    - unique
    - not_null
    - accepted_values:
        arguments:
          values: &id004
          - Champions
          - Loyal
          - At Risk
          - Big Spenders
          - New Customers
          - Promising
          - Needs Attention
          - Lost
          - No Purchase Yet
  - name: definition
    description: What the segment is, in plain words.
    data_tests:
    - not_null
  - name: rule
    description: The rule that puts a customer in the segment, in RFM scores.
    data_tests:
    - not_null
  - name: action
    description: What marketing should do with the segment.
    data_tests:
    - not_null
- name: fct_customer_segments
  description: One row per CRM customer with their segment, RFM scores and value. Buyers are segmented from RFM; customers
    without orders are 'No Purchase Yet'. The table the dashboards use for segment analysis.
  columns:
  - name: customer_id
    description: CRM customer id. Primary key.
    data_tests:
    - unique
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customers')
          field: customer_id
  - name: segment
    description: The customer's segment. Defined in dim_customer_segments.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customer_segments')
          field: segment
    - accepted_values:
        arguments:
          values: *id004
  - name: segment_order
    description: Position of the segment in the rule order (1 = Champions ... 9 = No Purchase Yet).
    data_tests:
    - not_null
  - name: is_buyer
    description: Placed at least one order.
    data_tests:
    - not_null
  - name: r_score
    description: Recency score 1-5 (5 = most recent). Empty for customers without orders.
  - name: f_score
    description: Frequency score 1-5. Empty for customers without orders.
  - name: m_score
    description: Monetary score 1-5 (5 = highest net revenue). Empty for customers without orders.
  - name: rfm_code
    description: The three scores as text, for example 534.
  - name: rfm_total
    description: Sum of the three scores, 3 to 15.
  - name: recency_days
    description: Days from the latest order to the RFM as-of date.
  - name: orders
    description: Number of orders. 0 for customers without orders.
    data_tests:
    - not_null
  - name: historical_net_revenue_usd
    description: Net revenue to date. 0 for customers without orders.
    data_tests:
    - not_null
  - name: predicted_revenue_90d_usd
    description: Expected net revenue in the next 90 days (see fct_customer_clv). 0 for customers without orders.
    data_tests:
    - not_null
  - name: predicted_revenue_12m_usd
    description: 'Expected net revenue in the next 12 months: an upper estimate. 0 for customers without orders.'
    data_tests:
    - not_null
  - name: clv_12m_usd
    description: Historical net revenue plus predicted 12-month revenue. 0 for customers without orders.
    data_tests:
    - not_null
  - name: country
    description: Customer country.
  - name: marketing_opt_in
    description: Whether the customer agreed to marketing messages. Check before contacting.
    data_tests:
    - not_null
  - name: has_linked_device
    description: At least one GA4 device is linked to the customer.
    data_tests:
    - not_null
  - name: first_order_channel_group
    description: Channel of the session behind the first order; empty unless matched to GA4.
  - name: first_session_channel_group
    description: Channel of the first session on a linked device.
- name: fct_attribution_credits
  description: 'Who gets the credit for each CRM order: one row per (order, model, credited touchpoint) for first touch, last
    touch, linear and time decay. First and last touch have one row per order; linear and time decay split the order over
    its touchpoints. Each order has exactly one unit of credit per model, so credited orders and revenue add up to the real
    totals. Rules in docs/attribution.md.'
  columns:
  - name: conversion_id
    description: CRM order id (the conversion). With model and touchpoint_session_key it is the primary key.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('fct_orders')
          field: order_id
  - name: model
    description: 'Attribution model: first_touch, last_touch, linear or time_decay. Credit shares sum to 1 per order and model.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: &id005
          - first_touch
          - last_touch
          - linear
          - time_decay
  - name: customer_id
    description: Customer who placed the order.
    data_tests:
    - not_null
  - name: order_ts
    description: Order time (UTC).
    data_tests:
    - not_null
  - name: order_date
    description: Order day.
  - name: order_channel
    description: web or app.
  - name: ga4_match_status
    description: 'How far the order links to GA4: matched, web_no_transaction_id or app_order.'
  - name: is_refunded
    description: The order was refunded.
  - name: touchpoint_session_key
    description: The GA4 session that receives the credit. Empty when the order has no touchpoint.
  - name: touchpoint_ts
    description: Start time of that session.
  - name: touchpoint_days_before_order
    description: Days from the credited session's start to the order, with fractions. Empty when there is no session. Time
      decay halves the weight every 7 days of it.
  - name: credited_channel
    description: 'Channel that receives the credit: the session''s channel when it has a known source, otherwise ''Direct
      / Unknown'' (only Direct, Unassigned, Self Referral or Other sessions exist), or ''No Touchpoint'' (no session at all).
      Never Direct, Self Referral, Unassigned or Other itself.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: &id006
          - Paid Search
          - Display
          - Paid Social
          - Affiliate
          - Email
          - Organic Search
          - Organic Social
          - Referral
          - Direct / Unknown
          - No Touchpoint
  - name: attribution_basis
    description: 'Why: known_source, direct_or_unknown or no_touchpoint.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - known_source
          - direct_or_unknown
          - no_touchpoint
  - name: touchpoint_channel_group
    description: Channel group of the credited session itself, as GA4 saw it. Empty when there is no session.
  - name: touchpoint_source
    description: Source of the credited session.
  - name: touchpoint_medium
    description: Medium of the credited session.
  - name: touchpoint_campaign
    description: Campaign of the credited session.
  - name: ad_campaign_key
    description: Ad-spend campaign key of the credited session, for paid sessions. Used for campaign ROI.
  - name: is_paid
    description: The credited session came from a paid channel.
    data_tests:
    - not_null
  - name: credit
    description: 'Share of the order credited in this row: 1 for first and last touch, 1/n for linear, the decay weight divided
      by the sum of weights for time_decay. Shares add up to 1 per order and model.'
    data_tests:
    - not_null
  - name: order_value_usd
    description: Order value before refunds.
  - name: revenue_usd
    description: Net revenue of the order (value minus refund).
    data_tests:
    - not_null
  - name: credited_revenue_usd
    description: 'revenue_usd times credit: the revenue this row gives to its channel.'
    data_tests:
    - not_null
- name: fct_attribution_by_channel
  description: 'Orders and net revenue credited to each channel under each model: one row per (model, channel). Built only
    from fct_attribution_credits, so models added there appear here automatically.'
  columns:
  - name: model
    description: Attribution model.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: *id005
  - name: credited_channel
    description: Channel that receives the credit. With model it is the primary key.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: *id006
  - name: attributed_orders
    description: Orders credited to the channel under the model (shares add up to the real order count).
    data_tests:
    - not_null
  - name: attributed_revenue_usd
    description: Net revenue credited to the channel under the model.
    data_tests:
    - not_null
  - name: share_of_orders
    description: Share of all orders under the model.
  - name: share_of_revenue
    description: Share of all net revenue under the model.
- name: fct_attribution_journeys
  description: 'One row per CRM order describing its journey, to show where the models can differ at all: an order with a
    single known-source touchpoint gets the same credit under first and last touch.'
  columns:
  - name: order_id
    description: CRM order. Primary key.
    data_tests:
    - unique
    - not_null
    - relationships:
        arguments:
          to: ref('fct_orders')
          field: order_id
  - name: customer_id
    description: Customer who placed the order.
    data_tests:
    - not_null
  - name: order_ts
    description: Order time (UTC).
  - name: order_channel
    description: web or app.
  - name: ga4_match_status
    description: matched, web_no_transaction_id or app_order.
  - name: net_revenue_usd
    description: Net revenue of the order.
    data_tests:
    - not_null
  - name: touchpoints
    description: GA4 sessions in the order's journey (0 if none).
    data_tests:
    - not_null
  - name: source_touchpoints
    description: Of those, sessions that have a known source.
    data_tests:
    - not_null
  - name: distinct_source_channels
    description: Different channels among the known-source sessions.
    data_tests:
    - not_null
  - name: days_from_first_touchpoint
    description: Days from the journey's first session to the order. Empty without touchpoints.
  - name: first_touch_channel
    description: Channel credited under first touch.
    data_tests:
    - not_null
  - name: last_touch_channel
    description: Channel credited under last touch.
    data_tests:
    - not_null
  - name: first_and_last_differ
    description: 'First touch and last touch credit different channels: the orders where the models disagree.'
    data_tests:
    - not_null
- name: fct_attribution_model_comparison
  description: 'The four attribution models side by side: one row per credited channel with orders and net revenue under each
    model, shares, how far the models disagree, and whether the channel mostly introduces or closes customers. The table the
    dashboard''s model-comparison view uses.'
  columns:
  - name: credited_channel
    description: Channel that receives the credit. Primary key.
    data_tests:
    - unique
    - not_null
    - accepted_values:
        arguments:
          values:
          - Paid Search
          - Display
          - Paid Social
          - Affiliate
          - Email
          - Organic Search
          - Organic Social
          - Referral
          - Direct / Unknown
          - No Touchpoint
  - name: is_known_source
    description: 'False for Direct / Unknown and No Touchpoint: orders whose journey has no known source.'
    data_tests:
    - not_null
  - name: is_paid_channel
    description: Paid Search, Display, Paid Social, Affiliate or Email.
    data_tests:
    - not_null
  - name: orders_first_touch
    description: Orders credited to the channel under first touch. Fractions are possible.
    data_tests:
    - not_null
  - name: orders_last_touch
    description: Orders credited to the channel under last touch. Fractions are possible.
    data_tests:
    - not_null
  - name: orders_linear
    description: Orders credited to the channel under linear. Fractions are possible.
    data_tests:
    - not_null
  - name: orders_time_decay
    description: Orders credited to the channel under time decay. Fractions are possible.
    data_tests:
    - not_null
  - name: revenue_first_touch
    description: Net revenue credited to the channel under first touch.
    data_tests:
    - not_null
  - name: revenue_last_touch
    description: Net revenue credited to the channel under last touch.
    data_tests:
    - not_null
  - name: revenue_linear
    description: Net revenue credited to the channel under linear.
    data_tests:
    - not_null
  - name: revenue_time_decay
    description: Net revenue credited to the channel under time decay.
    data_tests:
    - not_null
  - name: share_first_touch
    description: Share of all net revenue under first touch.
  - name: share_last_touch
    description: Share of all net revenue under last touch.
  - name: share_linear
    description: Share of all net revenue under linear.
  - name: share_time_decay
    description: Share of all net revenue under time decay.
  - name: revenue_min
    description: Lowest revenue the channel gets under any of the four models.
    data_tests:
    - not_null
  - name: revenue_max
    description: Highest revenue the channel gets under any of the four models.
    data_tests:
    - not_null
  - name: revenue_spread_usd
    description: 'Highest minus lowest revenue across the four models: how much the choice of model matters for this channel.'
    data_tests:
    - not_null
  - name: revenue_spread_pct
    description: The spread as a share of the channel's average revenue across the four models.
  - name: introducing_gap_usd
    description: 'First-touch minus last-touch revenue. Positive: the channel is better at introducing customers than closing
      them.'
    data_tests:
    - not_null
  - name: role
    description: Introduces or Closes when the gap is at least 5% of average revenue and at least $25; Neutral otherwise;
      No known source for Direct / Unknown and No Touchpoint.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - Introduces
          - Closes
          - Neutral
          - No known source
- name: fct_attribution_checks
  description: 'The attribution sanity checks as a table: credit adds up to orders and revenue under every model, every order
    has exactly one unit of credit, the channel table ties out, orders without a known source are credited the same by all
    models, and the orders tie to the customer profile. One row per check and model; the build fails if any row fails.'
  columns:
  - name: check_name
    description: What is checked. With model it is the primary key.
    data_tests:
    - not_null
  - name: model
    description: Attribution model the check is for, or 'all'.
    data_tests:
    - not_null
  - name: expected
    description: The value the check expects.
    data_tests:
    - not_null
  - name: actual
    description: The value found.
    data_tests:
    - not_null
  - name: difference
    description: actual minus expected.
    data_tests:
    - not_null
  - name: tolerance
    description: Largest allowed absolute difference.
    data_tests:
    - not_null
  - name: passed
    description: True when the absolute difference is within the tolerance. The build fails if any check is false.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - true
          quote: false
- name: fct_campaign_roi
  description: 'Return on ad spend for every paid campaign: spend, credited orders and revenue, ROAS, ROI and cost per acquisition,
    one row per (model, campaign), under the four attribution models and the GA4 same-session view. The ga4_session rows credit
    a purchase only to the campaign of its own session (the narrowest view); the four models also credit earlier campaigns
    in the customer''s journey. Spend is synthetic.'
  columns:
  - name: model
    description: 'Attribution model for the revenue: first_touch, last_touch, linear, time_decay (net revenue of CRM orders
      credited to the campaign) or ga4_session (every GA4 purchase credited to the campaign of its own session, the narrowest
      view).'
    data_tests: &id007
    - not_null
    - accepted_values:
        arguments:
          values:
          - first_touch
          - last_touch
          - linear
          - time_decay
          - ga4_session
  - name: campaign_key
    description: 'Paid campaign: channel, source, medium and campaign joined with ''|''. With model it is the primary key.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_ad_spend')
          field: campaign_key
  - name: channel
    description: Paid channel of the campaign.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: &id008
          - Paid Search
          - Display
          - Paid Social
          - Affiliate
          - Email
  - name: source
    description: Campaign source.
  - name: medium
    description: Campaign medium.
  - name: campaign
    description: Campaign name.
  - name: first_spend_date
    description: First day with spend.
  - name: last_spend_date
    description: Last day with spend.
  - name: days_with_spend
    description: Days on which the campaign had spend.
    data_tests:
    - not_null
  - name: impressions
    description: Impressions bought (synthetic).
  - name: clicks
    description: Clicks bought, sized from the real paid sessions.
    data_tests:
    - not_null
  - name: spend_usd
    description: 'Ad spend in USD (synthetic: assumed cost per click). The same under every model.'
    data_tests:
    - not_null
  - name: cost_per_click
    description: Spend per click.
  - name: attributed_orders
    description: Orders credited to the campaign under the model; fractions under linear and time decay.
    data_tests:
    - not_null
  - name: attributed_revenue_usd
    description: Revenue credited to the campaign under the model.
    data_tests:
    - not_null
  - name: profit_usd
    description: 'Revenue minus spend. Revenue, not margin: product costs are not in the data.'
    data_tests:
    - not_null
  - name: roas
    description: 'Return on ad spend: revenue per dollar of spend.'
  - name: roi
    description: (revenue - spend) / spend.
  - name: cpa_usd
    description: 'Cost per acquisition: spend per credited order. Empty when the campaign got no orders.'
  - name: revenue_per_click
    description: Revenue per click bought.
- name: fct_channel_roi
  description: 'The campaign return measures rolled up to the paid channel: one row per (model, channel). Built only from
    fct_campaign_roi.'
  columns:
  - name: model
    description: 'Attribution model for the revenue: first_touch, last_touch, linear, time_decay (net revenue of CRM orders
      credited to the campaign) or ga4_session (every GA4 purchase credited to the campaign of its own session, the narrowest
      view).'
    data_tests: *id007
  - name: channel
    description: Paid channel. With model it is the primary key.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: *id008
  - name: campaigns
    description: Campaigns in the channel.
    data_tests:
    - not_null
  - name: campaign_days
    description: Campaign-days with spend.
  - name: impressions
    description: Impressions bought (synthetic).
  - name: clicks
    description: Clicks bought.
    data_tests:
    - not_null
  - name: spend_usd
    description: Ad spend in USD (synthetic).
    data_tests:
    - not_null
  - name: cost_per_click
    description: Spend per click.
  - name: attributed_orders
    description: Orders credited to the channel's campaigns under the model.
    data_tests:
    - not_null
  - name: attributed_revenue_usd
    description: Revenue credited to the channel's campaigns under the model.
    data_tests:
    - not_null
  - name: profit_usd
    description: Revenue minus spend.
    data_tests:
    - not_null
  - name: roas
    description: Revenue per dollar of spend.
  - name: roi
    description: (revenue - spend) / spend.
  - name: cpa_usd
    description: Spend per credited order. Empty when no orders.
  - name: revenue_per_click
    description: Revenue per click bought.
- name: fct_campaign_cpa
  description: 'Cost per acquisition for every paid campaign, one row per (model, campaign): cost per order (CPA), cost per
    new customer (CAC), average order value and CPA against it, and a rank among campaigns with at least 5 orders. Spend is
    synthetic.'
  columns:
  - name: model
    description: 'Attribution model: first_touch, last_touch, linear, time_decay (CRM orders) or ga4_session (GA4 purchases
      of the campaign''s own sessions).'
    data_tests: &id009
    - not_null
    - accepted_values:
        arguments:
          values:
          - first_touch
          - last_touch
          - linear
          - time_decay
          - ga4_session
  - name: campaign_key
    description: Paid campaign (channel, source, medium, campaign joined with '|'). With model it is the primary key.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_ad_spend')
          field: campaign_key
  - name: channel
    description: Paid channel of the campaign.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: &id010
          - Paid Search
          - Display
          - Paid Social
          - Affiliate
          - Email
  - name: source
    description: Campaign source.
  - name: medium
    description: Campaign medium.
  - name: campaign
    description: Campaign name.
  - name: spend_usd
    description: 'Ad spend in USD (synthetic: assumed cost per click).'
    data_tests: &id011
    - not_null
  - name: clicks
    description: Clicks bought.
    data_tests:
    - not_null
  - name: attributed_orders
    description: Orders credited under the model (fractions under linear and time decay).
    data_tests: &id012
    - not_null
  - name: new_customers
    description: 'Credited first orders: customers won for the first time. Empty under ga4_session, which has no customer.'
  - name: repeat_orders
    description: Attributed orders minus new customers. Empty under ga4_session.
  - name: attributed_revenue_usd
    description: Revenue credited under the model.
    data_tests: &id013
    - not_null
  - name: cpa_usd
    description: 'Cost per acquisition: spend per attributed order. Empty when there are no orders.'
  - name: cac_usd
    description: 'Customer acquisition cost: spend per new customer. Empty when there are none.'
  - name: avg_order_value_usd
    description: Credited revenue per credited order.
  - name: cpa_to_aov
    description: cpa_usd divided by average order value. Below 1 the order's own revenue covers the cost of winning it.
  - name: has_enough_orders
    description: True when there are at least 5 attributed orders. Below that a CPA moves a lot with one order and is not
      ranked.
    data_tests: &id014
    - not_null
  - name: cpa_rank
    description: 1 = cheapest cost per order among rows with enough orders in the same model. Empty when there are not enough
      orders.
  - name: cpa_vs_channel
    description: cpa_usd divided by the CPA of the whole channel under the same model. Below 1 the campaign beats its channel.
- name: fct_channel_cpa
  description: Cost per acquisition for each paid channel, one row per (model, channel). Built only from fct_campaign_cpa.
  columns:
  - name: model
    description: 'Attribution model: first_touch, last_touch, linear, time_decay (CRM orders) or ga4_session (GA4 purchases
      of the campaign''s own sessions).'
    data_tests: *id009
  - name: channel
    description: Paid channel. With model it is the primary key.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: *id010
  - name: campaigns
    description: Campaigns in the channel.
    data_tests:
    - not_null
  - name: spend_usd
    description: 'Ad spend in USD (synthetic: assumed cost per click).'
    data_tests: *id011
  - name: clicks
    description: Clicks bought.
    data_tests:
    - not_null
  - name: attributed_orders
    description: Orders credited under the model (fractions under linear and time decay).
    data_tests: *id012
  - name: new_customers
    description: 'Credited first orders: customers won for the first time. Empty under ga4_session, which has no customer.'
  - name: repeat_orders
    description: Attributed orders minus new customers. Empty under ga4_session.
  - name: attributed_revenue_usd
    description: Revenue credited under the model.
    data_tests: *id013
  - name: cpa_usd
    description: 'Cost per acquisition: spend per attributed order. Empty when there are no orders.'
  - name: cac_usd
    description: 'Customer acquisition cost: spend per new customer. Empty when there are none.'
  - name: avg_order_value_usd
    description: Credited revenue per credited order.
  - name: cpa_to_aov
    description: cpa_usd divided by average order value. Below 1 the order's own revenue covers the cost of winning it.
  - name: has_enough_orders
    description: True when there are at least 5 attributed orders. Below that a CPA moves a lot with one order and is not
      ranked.
    data_tests: *id014
  - name: cpa_rank
    description: 1 = cheapest cost per order among rows with enough orders in the same model. Empty when there are not enough
      orders.
