version: 2
models:
- name: int_ga4__sessions
  description: One row per GA4 session (device plus ga_session_id), summarised from its events.
  columns:
  - name: session_key
    description: Device and GA4 session id joined with a dot. Primary key.
    data_tests:
    - unique
    - not_null
  - name: user_pseudo_id
    description: GA4 device that had the session.
    data_tests:
    - not_null
  - name: ga_session_id
    description: GA4 session id. Unique only together with user_pseudo_id.
    data_tests:
    - not_null
  - name: ga_session_number
    description: 1 for the device's first session, 2 for its second, and so on.
  - name: session_date
    description: Day the session started.
    data_tests:
    - not_null
  - name: session_start_ts
    description: Time of the first event (UTC).
    data_tests:
    - not_null
  - name: session_end_ts
    description: Time of the last event (UTC).
    data_tests:
    - not_null
  - name: events
    description: Number of events in the session.
    data_tests:
    - not_null
  - name: page_views
    description: Number of page_view events.
  - name: purchase_events
    description: Raw purchase events, including invalid ones (no transaction id, zero revenue, repeats).
  - name: viewed_item
    description: The session had a view_item event.
  - name: added_to_cart
    description: The session had an add_to_cart event.
  - name: began_checkout
    description: The session had a begin_checkout event.
  - name: is_engaged
    description: GA4 marked the session as engaged.
  - name: engagement_time_msec
    description: Total engaged time in milliseconds.
  - name: has_gclid
    description: A Google Ads click id was present in the session.
  - name: landing_page
    description: First page URL of the session.
  - name: referrer
    description: First referrer URL seen in the session.
  - name: source
    description: 'SESSION-level source: first source parameter seen. Empty on about 1 session in 4.'
  - name: medium
    description: 'SESSION-level medium: first medium parameter seen.'
  - name: campaign
    description: 'SESSION-level campaign: first campaign parameter seen. Often obfuscated as <Other>.'
  - name: country
    description: Country of the device.
  - name: device_category
    description: desktop, mobile or tablet.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - desktop
          - mobile
          - tablet
        config:
          severity: warn
  - name: first_touch_source
    description: 'USER-level source: how the device was first acquired. Kept to compare with the session source.'
  - name: first_touch_medium
    description: USER-level medium of first acquisition.
  - name: first_touch_campaign
    description: USER-level campaign of first acquisition.
- name: int_conversion_touchpoints
  description: 'The journey behind every CRM order: one row per (order, GA4 session that could have led to it). Sessions on
    the purchasing device or on any device linked to the customer, started no later than the order and within 30 days before
    it (the purchasing session is always kept). The base for every attribution model.'
  columns:
  - name: order_id
    description: CRM order the session could have led to. With session_key it is the primary key.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('fct_orders')
          field: order_id
  - name: session_key
    description: GA4 session (device and session id).
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('fct_sessions')
          field: session_key
  - name: user_pseudo_id
    description: GA4 device of the session.
    data_tests:
    - not_null
  - name: session_date
    description: Day the session started.
  - name: session_start_ts
    description: Time the session started (UTC).
    data_tests:
    - not_null
  - name: channel_group
    description: Marketing channel of the session.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - Paid Search
          - Display
          - Paid Social
          - Affiliate
          - Email
          - Organic Search
          - Organic Social
          - Referral
          - Self Referral
          - Direct
          - Other
          - Unassigned
  - name: source
    description: Session source.
  - name: medium
    description: Session medium.
  - name: campaign
    description: Session campaign.
  - name: ad_campaign_key
    description: Joins a paid session to the ad-spend campaign key.
  - name: is_paid
    description: The session came from a paid channel.
    data_tests:
    - not_null
  - name: has_source
    description: 'True when the session says where the visitor came from. False for Self Referral (the store''s own site),
      Direct, Unassigned and Other (the values GA4 hides in its public sample): attribution skips these whenever a session
      with a source exists.'
    data_tests:
    - not_null
  - name: is_purchase_session
    description: The session in which a matched web order was placed.
    data_tests:
    - not_null
  - name: days_before_order
    description: Days from the session start to the order, with fractions. 0 or more.
    data_tests:
    - not_null
